<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Lamina cientifica de PaleoBot</title>
  <desc id="desc">Composicion de craneo hominino, estratigrafia, mapa y lineas de evidencia para portada cientifica.</desc>
  <defs>
